<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<title>لوحة ZIDAN</title>
<style>
:root{--bg:#0b0d10;--panel:#14171b;--panel2:#1b2026;--line:#2a3037;--text:#f2ede4;--muted:#98a1ab;--gold:#e2c27a;--btn:linear-gradient(135deg,#e0bd6a,#b98f38);--ok:#2e9e5b;--no:#c2453d;--sold:#5b6fb5;}
@media (prefers-color-scheme:light){:root{--bg:#f7f4ee;--panel:#fff;--panel2:#efe9dc;--line:#e2dbc9;--text:#1a1610;--muted:#6b6455;--gold:#8f6b1c;}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.6;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
textarea{min-height:90px}
label{display:block;margin:12px 0 6px;color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;color:var(--text);background:var(--panel2);min-height:48px}
.btn.gold{background:var(--btn);color:#1a1300}.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}.btn.sold{background:var(--sold);color:#fff}.btn.full{width:100%}
.btn:disabled{opacity:.55}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
#login img{width:84px;height:84px;border-radius:20px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.tabs{display:flex;gap:8px;padding:10px 16px;max-width:640px;margin:0 auto}
.tabs button{flex:1;font:inherit;font-weight:700;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--btn);color:#1a1300;border-color:transparent}
.tabs b{font-weight:800;margin-inline-start:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px}
.card img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex-shrink:0;background:var(--panel2)}
.card .noimg{width:84px;height:84px;border-radius:12px;background:var(--panel2);flex-shrink:0}
.info{flex:1;min-width:0}
.info h3{margin:0 0 2px;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px}
.price{color:var(--gold);font-weight:800}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-inline-end:6px}
.who{margin-top:6px;font-size:15px}.who a{color:var(--gold);margin-inline-start:10px;font-weight:700;text-decoration:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .btn{flex:1;min-width:110px;padding:10px 12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
#fab{position:fixed;left:16px;right:16px;max-width:608px;margin:0 auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:999px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{color:var(--no);min-height:24px}
</style>
</head>
<body>

<div id="login" class="wrap">
  <img src="icon-192.png" alt="" onerror="this.style.display='none'">
  <h1>لوحة عقارات ZIDAN</h1>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="الرقم السري">
  <button class="btn gold full" id="go">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="app" hidden>
  <div class="top"><div class="wrap"><h1>عقاراتي</h1><div><button class="btn" id="refresh">تحديث</button> <button class="btn" id="logout">خروج</button></div></div>
    <div class="tabs" id="tabs">
      <button data-tab="new">جديدة <b id="c-new">0</b></button>
      <button data-tab="live" class="on">ظاهرة <b id="c-live">0</b></button>
      <button data-tab="done">مقفولة <b id="c-done">0</b></button>
    </div>
  </div>
  <div class="wrap" id="list"></div>
  <button class="btn gold" id="fab">＋ عقار جديد</button>
</div>

<div id="addView" hidden>
  <div class="top"><div class="wrap"><h1>عقار جديد</h1><button class="btn" id="addBack">رجوع</button></div></div>
  <form class="wrap" id="addForm">
    <div class="row2">
      <div><label for="a-type">نوع العقار</label><select id="a-type"><option>شقة</option><option>بيت</option><option>أرض</option><option>محل</option></select></div>
      <div><label for="a-deal">نوع العرض</label><select id="a-deal"><option>بيع</option><option>إيجار</option></select></div>
    </div>
    <label for="a-title">عنوان قصير (اختياري)</label><input id="a-title" placeholder="مثال: شقة 130م بموقع مميز">
    <label for="a-loc">المنطقة</label><input id="a-loc" required>
    <div class="row2">
      <div><label for="a-price">السعر</label><input id="a-price" placeholder="850,000 جنيه"></div>
      <div><label for="a-area">المساحة</label><input id="a-area" placeholder="130 م²"></div>
    </div>
    <label for="a-rooms">عدد الغرف (اختياري)</label><input id="a-rooms" placeholder="3 غرف">
    <label for="a-desc">تفاصيل (اختياري)</label><textarea id="a-desc" placeholder="الدور، التشطيب..."></textarea>
    <label for="a-photos">الصور (حتى 5)</label><input id="a-photos" type="file" accept="image/*" multiple>
    <label style="display:flex;gap:10px;align-items:center;margin-top:16px"><input id="a-owner" type="checkbox" style="width:22px;height:22px"> مباشرة من المالك (بدون سمسار)</label>
    <button class="btn gold full" id="addSave" type="submit" style="margin-top:20px">حفظ ونشر على الموقع</button>
  </form>
</div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyis5BlfCDMoULUIu61vd_uQfdLz5lsWw5cAhA7sLnRYpJPWRSfRFXRqoXTAkpA2exI/exec';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const waNum = s => { let d = digits(s); if(d.startsWith('00')) d = d.slice(2); if(d.startsWith('0')) d = '20' + d.slice(1); return d; };
let pin = '', items = [], tab = 'live';

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3200); }
async function call(obj){
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ key: pin }, obj)) });
  return await r.json();
}
function show(which){ ['login','app','addView'].forEach(id => $('#' + id).hidden = id !== which); window.scrollTo(0, 0); }

async function load(){
  try{
    const j = await call({ action: 'admin_list' });
    if(!j.success){ if(j.error === 'auth') return 'auth'; return 'fail'; }
    items = j.items || []; render(); return 'ok';
  }catch(e){ return 'fail'; }
}
async function login(p){
  pin = p; $('#loginMsg').textContent = ''; $('#go').disabled = true;
  const r = await load(); $('#go').disabled = false;
  if(r === 'ok'){ try{ localStorage.setItem('zidan-admin-pin', pin); }catch(e){} show('app'); return; }
  pin = ''; try{ localStorage.removeItem('zidan-admin-pin'); }catch(e){}
  $('#loginMsg').textContent = r === 'auth' ? 'الرقم السري غلط (أو الدخول اتقفل شوية بسبب محاولات كتير)' : 'مفيش اتصال، جرّب تاني';
  show('login');
}
$('#go').onclick = () => login($('#pin').value.trim());
$('#pin').addEventListener('keydown', e => { if(e.key === 'Enter') $('#go').click(); });
$('#logout').onclick = () => { try{ localStorage.removeItem('zidan-admin-pin'); }catch(e){} pin = ''; items = []; $('#pin').value = ''; show('login'); };
$('#refresh').onclick = async () => { const r = await load(); toast(r === 'ok' ? 'اتحدّث' : 'تعذّر التحديث'); };

const group = p => p.status === 'معلق' ? 'new' : p.status === 'موافق' ? 'live' : 'done';
function render(){
  const c = { new: 0, live: 0, done: 0 }; items.forEach(p => c[group(p)]++);
  ['new','live','done'].forEach(k => $('#c-' + k).textContent = c[k]);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const list = items.filter(p => group(p) === tab);
  $('#list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">' + (tab === 'new' ? 'مفيش طلبات جديدة' : tab === 'live' ? 'مفيش عقارات ظاهرة' : 'مفيش عقارات مقفولة') + '</div>';
}
function sized(u){ return /^https:\/\/lh3\.googleusercontent\.com\/d\/[\w-]+$/.test(u || '') ? u + '=w200' : (/^https:\/\//.test(u || '') ? u : ''); }
function btn(label, to, cls, ask, id){ return '<button class="btn ' + cls + '" data-id="' + esc(id) + '" data-to="' + esc(to) + '" data-ask="' + esc(ask || '') + '">' + label + '</button>'; }
function card(p){
  const rent = String(p.deal).includes('يجار');
  const img = sized((p.photos || [])[0]);
  const who = (p.name || p.phone) ? '<div class="who">' + esc(p.name) + (p.phone ? ' <a href="tel:' + digits(p.phone) + '">اتصال</a><a href="https://wa.me/' + waNum(p.phone) + '" target="_blank" rel="noopener">واتساب</a>' : '') + '</div>' : '';
  let acts;
  if(p.status === 'معلق') acts = btn('موافق ✓', 'موافق', 'ok', '', p.id) + btn('رفض', 'مرفوض', 'no', 'رفض الطلب ده؟', p.id);
  else if(p.status === 'موافق'){ const d = rent ? 'تم التأجير' : 'تم البيع'; acts = btn(d, d, 'sold', 'تأكيد: ' + d + '؟ هيختفي من الموقع.', p.id) + btn('إخفاء', 'مرفوض', '', 'تخفي العقار ده من الموقع؟', p.id); }
  else acts = btn('رجّعه ظاهر على الموقع', 'موافق', 'ok', '', p.id);
  return '<div class="card">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=noimg></div>\'">' : '<div class="noimg"></div>') +
    '<div class="info"><h3>' + esc(p.title || (p.loc + ' - ' + p.type)) + '</h3><div class="meta"><span class="chip">' + esc(p.type) + '</span><span class="chip">' + esc(p.deal || '—') + '</span>' + (p.status !== 'معلق' && p.status !== 'موافق' ? '<span class="chip">' + esc(p.status) + '</span>' : '') + '</div>' +
    '<div class="meta">' + esc(p.loc) + (p.price ? ' · <span class="price">' + esc(p.price) + '</span>' : '') + '</div>' + who + '<div class="acts">' + acts + '</div></div></div>';
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(b){ tab = b.dataset.tab; render(); } });
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-to]'); if(!b) return;
  if(b.dataset.ask && !confirm(b.dataset.ask)) return;
  b.disabled = true;
  try{
    const j = await call({ action: 'admin_status', id: b.dataset.id, status: b.dataset.to });
    if(j.success){ const p = items.find(x => x.id === b.dataset.id); if(p) p.status = b.dataset.to; render(); toast('تمام ✓'); }
    else { b.disabled = false; toast('ماحصلش، جرّب تاني'); }
  }catch(err){ b.disabled = false; toast('مفيش اتصال'); }
});

// ---- add a property ----
$('#fab').onclick = () => show('addView');
$('#addBack').onclick = () => show('app');
function compressImage(file, maxDim = 1200, q = 0.72){
  return new Promise(resolve => {
    let done = false; const finish = v => { if(!done){ done = true; resolve(v); } };
    const timer = setTimeout(() => finish(''), 10000);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { try{
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      finish(c.toDataURL('image/jpeg', q).split(',')[1]);
    }catch(e){ finish(''); } clearTimeout(timer); URL.revokeObjectURL(url); };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); finish(''); };
    img.src = url;
  });
}
$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#addSave'); btn.disabled = true; const label = btn.textContent;
  const v = id => $('#' + id).value.trim();
  try{
    const files = Array.from($('#a-photos').files || []).slice(0, 5), photos = [];
    if(files.length) btn.textContent = 'بجهّز الصور...';
    for(const f of files){ const b = await compressImage(f); if(b) photos.push(b); }
    btn.textContent = 'بحفظ...';
    const j = await call({ action: 'admin_add', type: v('a-type'), deal: v('a-deal'), loc: v('a-loc'), title: v('a-title') || (v('a-loc') + ' - ' + v('a-type')), price: v('a-price'), area: v('a-area'), rooms: v('a-rooms'), desc: v('a-desc'), owner: $('#a-owner').checked });
    if(!j.success) throw new Error('save');
    let up = 0;
    for(let i = 0; i < photos.length; i++){
      btn.textContent = 'برفع الصور ' + (i + 1) + '/' + photos.length;
      for(let t = 0; t < 2; t++){ try{ const r = await call({ action: 'admin_photo', id: j.id, data: photos[i] }); if(r.success){ up++; break; } }catch(err){} }
    }
    $('#addForm').reset(); await load(); tab = 'live'; render(); show('app');
    toast(up < photos.length ? 'اتنشر، بس ' + (photos.length - up) + ' صورة ماترفعتش' : 'اتنشر على الموقع ✓');
  }catch(err){ toast('ماحصلش حفظ، جرّب تاني'); }
  btn.disabled = false; btn.textContent = label;
});
fetch(API + '?action=meta').then(r => r.json()).then(m => {
  if(m && Array.isArray(m.types) && m.types.length) $('#a-type').innerHTML = m.types.map(t => '<option>' + esc(t.value) + '</option>').join('');
}).catch(() => {});

try{ const saved = localStorage.getItem('zidan-admin-pin'); if(saved){ login(saved); } else show('login'); }catch(e){ show('login'); }
</script>
</body>
</html>
