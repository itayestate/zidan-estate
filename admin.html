<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<title>لوحة ZIDAN</title>
<style>
:root{--bg:#0b0d10;--panel:#14171b;--panel2:#1b2026;--line:#2a3037;--text:#f2ede4;--muted:#98a1ab;--gold:#e2c27a;--btn:linear-gradient(135deg,#e0bd6a,#b98f38);--ok:#2e9e5b;--no:#c2453d;--sold:#5b6fb5;}
@media (prefers-color-scheme:light){:root{--bg:#f7f4ee;--panel:#fff;--panel2:#efe9dc;--line:#e2dbc9;--text:#1a1610;--muted:#6b6455;--gold:#8f6b1c;}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px}
h1{font-size:21px;margin:0}h2{font-size:18px;margin:18px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
textarea{min-height:90px}
label{display:block;margin:12px 0 6px;color:var(--muted);font-size:15px}
.chk{display:flex;gap:10px;align-items:center;color:var(--text);margin-top:14px}.chk input{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;color:var(--text);background:var(--panel2);min-height:46px}
.btn.gold{background:var(--btn);color:#1a1300}.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}.btn.sold{background:var(--sold);color:#fff}.btn.full{width:100%}.btn:disabled{opacity:.55}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
#login img{width:84px;height:84px;border-radius:20px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;font:inherit;font-weight:700;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--btn);color:#1a1300;border-color:transparent}.tabs b{margin-inline-start:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;gap:12px;cursor:pointer}
.card img,.noimg{width:80px;height:80px;object-fit:cover;border-radius:12px;flex-shrink:0;background:var(--panel2)}
.info{flex:1;min-width:0}.info h3{margin:0 0 2px;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px}.price{color:var(--gold);font-weight:800}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-inline-end:6px}.chip.star{background:#d9a93a;color:#2a1d00}
.who{margin-top:6px;font-size:15px}.who a{color:var(--gold);margin-inline-start:10px;font-weight:700;text-decoration:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .btn{flex:1;min-width:100px;padding:9px 10px;min-height:42px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;font:inherit;font-size:14px;font-weight:700;background:none;border:0;color:var(--muted);padding:10px 4px;cursor:pointer}
.nav button span{display:block;font-size:20px;line-height:1.1}.nav button.on{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:12px 18px;border-radius:999px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{color:var(--no);min-height:24px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ph{position:relative;width:84px;height:84px}.ph img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.ph button{position:absolute;top:-6px;left:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--no);color:#fff;font-size:16px;cursor:pointer}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px}.log small{color:var(--muted);display:block}
.hint{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div id="login" class="wrap">
  <img src="icon-192.png" alt="" onerror="this.style.display='none'">
  <h1>لوحة تحكم ZIDAN</h1>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="الرقم السري">
  <button class="btn gold full" id="go">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="shell" hidden>
  <div class="top"><div class="wrap"><h1 id="ttl">العقارات</h1><div><button class="btn" id="refresh">تحديث</button> <button class="btn" id="logout">خروج</button></div></div></div>
  <div class="wrap">
    <section id="v-list">
      <input id="q" type="search" placeholder="ابحث بالاسم أو المنطقة أو التليفون...">
      <div class="tabs" id="tabs">
        <button data-tab="new">جديدة <b id="c-new">0</b></button>
        <button data-tab="live" class="on">ظاهرة <b id="c-live">0</b></button>
        <button data-tab="done">مقفولة <b id="c-done">0</b></button>
      </div>
      <div id="list"></div>
    </section>

    <section id="v-add" hidden>
      <form id="addForm">
        <div class="row2">
          <div><label for="a-type">نوع العقار</label><select id="a-type" class="types"></select></div>
          <div><label for="a-deal">نوع العرض</label><select id="a-deal"><option>بيع</option><option>إيجار</option></select></div>
        </div>
        <label for="a-title">عنوان قصير (اختياري)</label><input id="a-title" placeholder="مثال: شقة 130م بموقع مميز">
        <label for="a-loc">المنطقة</label><input id="a-loc" required>
        <div class="row2">
          <div><label for="a-price">السعر</label><input id="a-price" placeholder="850,000 جنيه"></div>
          <div><label for="a-area">المساحة</label><input id="a-area" placeholder="130 م²"></div>
        </div>
        <label for="a-rooms">عدد الغرف (اختياري)</label><input id="a-rooms" placeholder="3 غرف">
        <label for="a-desc">تفاصيل (اختياري)</label><textarea id="a-desc" placeholder="الدور، التشطيب..."></textarea>
        <label for="a-photos">الصور (حتى 5)</label><input id="a-photos" type="file" accept="image/*" multiple>
        <label class="chk"><input id="a-owner" type="checkbox"> مباشرة من المالك (بدون سمسار)</label>
        <button class="btn gold full" id="addSave" type="submit" style="margin-top:18px">حفظ ونشر على الموقع</button>
      </form>
    </section>

    <section id="v-site" hidden>
      <p class="hint">أي تعديل هنا بيظهر على الموقع خلال دقيقة تقريباً. لو مسحت خانة، الموقع بيرجع للنص الأصلي.</p>
      <h2>التواصل</h2>
      <label for="s-whatsapp">رقم الواتساب (بالكود: 20...)</label><input id="s-whatsapp" inputmode="tel">
      <label for="s-phone">رقم الاتصال</label><input id="s-phone" inputmode="tel">
      <label for="s-facebook">رابط صفحة فيسبوك</label><input id="s-facebook" inputmode="url">
      <h2>الصفحة الرئيسية</h2>
      <label for="s-hero_title">العنوان الكبير</label><input id="s-hero_title">
      <label for="s-hero_lead">الجملة تحته</label><textarea id="s-hero_lead"></textarea>
      <label for="s-about_text">نبذة "من نحن"</label><textarea id="s-about_text"></textarea>
      <h2>إعلان فوق العقارات</h2>
      <label for="s-announce_text">نص الإعلان (سيبه فاضي لو مفيش)</label><input id="s-announce_text" placeholder="مثال: عروض جديدة الأسبوع ده">
      <label class="chk"><input id="s-announce_on" type="checkbox" checked> إظهار الإعلان</label>
      <button class="btn gold full" id="siteSave" style="margin-top:18px">حفظ إعدادات الموقع</button>
    </section>

    <section id="v-log" hidden>
      <div class="tabs" id="stats" style="pointer-events:none"></div>
      <h2>آخر الحركات</h2><div id="logList"></div>
    </section>
  </div>
  <nav class="nav" id="nav">
    <button data-go="list" class="on"><span>🏠</span>العقارات</button>
    <button data-go="add"><span>＋</span>جديد</button>
    <button data-go="site"><span>⚙️</span>الموقع</button>
    <button data-go="log"><span>📋</span>الحركة</button>
  </nav>
</div>

<div id="edit" hidden>
  <div class="top"><div class="wrap"><h1>تعديل عقار</h1><button class="btn" id="eBack">رجوع</button></div></div>
  <div class="wrap">
    <div class="row2">
      <div><label for="e-type">نوع العقار</label><select id="e-type" class="types"></select></div>
      <div><label for="e-deal">نوع العرض</label><select id="e-deal"><option>بيع</option><option>إيجار</option></select></div>
    </div>
    <label for="e-title">العنوان</label><input id="e-title">
    <label for="e-loc">المنطقة</label><input id="e-loc">
    <div class="row2">
      <div><label for="e-price">السعر</label><input id="e-price"></div>
      <div><label for="e-area">المساحة</label><input id="e-area"></div>
    </div>
    <label for="e-rooms">الغرف</label><input id="e-rooms">
    <label for="e-desc">التفاصيل</label><textarea id="e-desc"></textarea>
    <label class="chk"><input id="e-owner" type="checkbox"> مباشرة من المالك</label>
    <label class="chk"><input id="e-featured" type="checkbox"> ★ عقار مميز (يظهر الأول وعليه شارة)</label>
    <label>الصور</label><div class="photos" id="ePhotos"></div>
    <label for="e-add">إضافة صور</label><input id="e-add" type="file" accept="image/*" multiple>
    <button class="btn gold full" id="eSave" style="margin-top:18px">حفظ التعديلات</button>
  </div>
</div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyis5BlfCDMoULUIu61vd_uQfdLz5lsWw5cAhA7sLnRYpJPWRSfRFXRqoXTAkpA2exI/exec';
const DEF = { whatsapp:'201114875284', phone:'01508658715', facebook:'https://www.facebook.com/profile.php?id=61591765501946',
  hero_title:'أكثر من مجرد عقار.. دي بداية جديدة',
  hero_lead:'بيع، شراء وإيجار شقق، بيوت، محلات وأراضي في إيتاي البارود والمناطق المحيطة بها، بمتابعة شخصية من أول معاينة لحد التسليم.',
  about_text:'ZIDAN وسيط عقاري بيشتغل في إيتاي البارود والقرى التابعة لها. بنقرّب المشتري والبائع والمستأجر من غير تعقيد، ونتابع معاك كل خطوة من المعاينة لحد التعاقد.',
  announce_text:'', announce_on:'نعم' };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const waNum = s => { let d = digits(s); if(d.startsWith('00')) d = d.slice(2); if(d.startsWith('0')) d = '20' + d.slice(1); return d; };
let pin = '', items = [], tab = 'live', types = ['شقة','بيت','أرض','محل'], ed = null;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3200); }
async function call(obj){ const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ key: pin }, obj)) }); return await r.json(); }
function screen(id){ ['login','shell','edit'].forEach(x => $('#' + x).hidden = x !== id); window.scrollTo(0, 0); }
const sized = (u, w = 200) => /^https:\/\/lh3\.googleusercontent\.com\/d\/[\w-]+$/.test(u || '') ? u + '=w' + w : (/^https:\/\//.test(u || '') ? u : '');
function fillTypes(extra){ const list = types.slice(); if(extra && !list.includes(extra)) list.push(extra); document.querySelectorAll('.types').forEach(s => { const cur = s.value; s.innerHTML = list.map(t => '<option>' + esc(t) + '</option>').join(''); if(cur) s.value = cur; }); }

// ---------- data ----------
async function load(){
  try{ const j = await call({ action: 'admin_list' }); if(!j.success) return j.error === 'auth' ? 'auth' : 'fail';
    items = j.items || []; try{ localStorage.setItem('zidan-admin-items', JSON.stringify(items)); }catch(e){} render(); return 'ok'; }catch(e){ return 'fail'; }
}
// قبل أي إرسال: نتأكد إن الكود المنشور في Apps Script هو النسخة الجديدة (لو قديم ممكن يسجّل صفوف فاضية في الشيت)
async function scriptState(){
  try{ const r = await fetch(API + '?action=meta&fresh=1', { cache: 'no-store' }); const m = await r.json(); return (m && Number(m.v) >= 8) ? 'ok' : 'old'; }catch(e){ return 'offline'; }
}
async function login(p){
  pin = p; $('#loginMsg').textContent = ''; $('#go').disabled = true;
  const st = await scriptState();
  if(st !== 'ok'){
    $('#go').disabled = false; pin = '';
    $('#loginMsg').textContent = st === 'old' ? 'كود Apps Script لسه قديم. انشره كنسخة جديدة (Deploy > Manage deployments > New version) وبعدها جرّب تاني.' : 'مفيش اتصال، جرّب تاني';
    screen('login'); return;
  }
  const r = await load(); $('#go').disabled = false;
  if(r === 'ok'){ try{ localStorage.setItem('zidan-admin-pin', pin); }catch(e){} screen('shell'); return; }
  pin = ''; try{ localStorage.removeItem('zidan-admin-pin'); }catch(e){}
  $('#loginMsg').textContent = r === 'auth' ? 'الرقم السري غلط (أو الدخول اتقفل شوية بسبب محاولات كتير)' : 'مفيش اتصال، جرّب تاني'; screen('login');
}
$('#go').onclick = () => login($('#pin').value.trim());
$('#pin').addEventListener('keydown', e => { if(e.key === 'Enter') $('#go').click(); });
$('#logout').onclick = () => { try{ localStorage.removeItem('zidan-admin-pin'); localStorage.removeItem('zidan-admin-items'); }catch(e){} pin = ''; items = []; $('#pin').value = ''; screen('login'); };
$('#refresh').onclick = async () => { const r = await load(); toast(r === 'ok' ? 'اتحدّث' : 'تعذّر التحديث'); };

// ---------- navigation ----------
const TITLES = { list:'العقارات', add:'عقار جديد', site:'إعدادات الموقع', log:'الحركة' };
function go(name){
  ['list','add','site','log'].forEach(n => $('#v-' + n).hidden = n !== name);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  $('#ttl').textContent = TITLES[name]; window.scrollTo(0, 0);
  if(name === 'site') loadSite(); if(name === 'log') loadLog();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if(b) go(b.dataset.go); });

// ---------- properties list ----------
const group = p => p.status === 'معلق' ? 'new' : p.status === 'موافق' ? 'live' : 'done';
function render(){
  const c = { new: 0, live: 0, done: 0 }; items.forEach(p => c[group(p)]++);
  ['new','live','done'].forEach(k => $('#c-' + k).textContent = c[k]);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const q = $('#q').value.trim();
  const list = items.filter(p => group(p) === tab && (!q || [p.title, p.loc, p.name, p.phone, p.price, p.type].join(' ').includes(q)));
  $('#list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">' + (q ? 'مفيش نتايج للبحث' : tab === 'new' ? 'مفيش طلبات جديدة' : tab === 'live' ? 'مفيش عقارات ظاهرة' : 'مفيش عقارات مقفولة') + '</div>';
}
function btn(label, to, cls, ask, id){ return '<button class="btn ' + cls + '" data-id="' + esc(id) + '" data-to="' + esc(to) + '" data-ask="' + esc(ask || '') + '">' + label + '</button>'; }
function card(p){
  const rent = String(p.deal).includes('يجار'), img = sized((p.photos || [])[0]);
  const who = (p.name || p.phone) ? '<div class="who">' + esc(p.name) + (p.phone ? ' <a href="tel:' + digits(p.phone) + '">اتصال</a><a href="https://wa.me/' + waNum(p.phone) + '" target="_blank" rel="noopener">واتساب</a>' : '') + '</div>' : '';
  let acts;
  if(p.status === 'معلق') acts = btn('موافق ✓', 'موافق', 'ok', '', p.id) + btn('رفض', 'مرفوض', 'no', 'رفض الطلب ده؟', p.id);
  else if(p.status === 'موافق'){ const d = rent ? 'تم التأجير' : 'تم البيع'; acts = btn(d, d, 'sold', 'تأكيد: ' + d + '؟ هيختفي من الموقع.', p.id) + btn('إخفاء', 'مرفوض', '', 'تخفي العقار ده من الموقع؟', p.id); }
  else acts = btn('رجّعه ظاهر', 'موافق', 'ok', '', p.id);
  return '<div class="card" data-open="' + esc(p.id) + '">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=noimg></div>\'">' : '<div class="noimg"></div>') +
    '<div class="info"><h3>' + esc(p.title || (p.loc + ' - ' + p.type)) + '</h3><div class="meta">' + (p.featured ? '<span class="chip star">★ مميز</span>' : '') + '<span class="chip">' + esc(p.type) + '</span><span class="chip">' + esc(p.deal || '—') + '</span>' + (group(p) === 'done' ? '<span class="chip">' + esc(p.status) + '</span>' : '') + '</div>' +
    '<div class="meta">' + esc(p.loc) + (p.price ? ' · <span class="price">' + esc(p.price) + '</span>' : '') + '</div>' + who + '<div class="acts">' + acts + '</div></div></div>';
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(b){ tab = b.dataset.tab; render(); } });
$('#q').addEventListener('input', render);
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-to]');
  if(b){
    if(b.dataset.ask && !confirm(b.dataset.ask)) return;
    b.disabled = true;
    try{ const j = await call({ action: 'admin_status', id: b.dataset.id, status: b.dataset.to });
      if(j.success){ const p = items.find(x => x.id === b.dataset.id); if(p) p.status = b.dataset.to; render(); toast('تمام ✓'); } else { b.disabled = false; toast('ماحصلش، جرّب تاني'); }
    }catch(err){ b.disabled = false; toast('مفيش اتصال'); }
    return;
  }
  if(e.target.closest('a')) return;
  const c = e.target.closest('.card'); if(c) openEdit(c.dataset.open);
});

// ---------- edit a property ----------
function drawPhotos(){ $('#ePhotos').innerHTML = ed.photos.length ? ed.photos.map((u, i) => '<div class="ph"><img src="' + esc(sized(u, 160)) + '" alt=""><button type="button" data-i="' + i + '" aria-label="مسح">×</button></div>').join('') : '<span class="hint">مفيش صور</span>'; }
function openEdit(id){
  const p = items.find(x => x.id === id); if(!p) return;
  ed = { id, photos: (p.photos || []).slice(), changed: false };
  fillTypes(p.type);
  $('#e-type').value = p.type || ''; $('#e-deal').value = p.deal || 'بيع';
  ['title','loc','price','area','rooms','desc'].forEach(k => $('#e-' + k).value = p[k] || '');
  $('#e-owner').checked = !!p.owner; $('#e-featured').checked = !!p.featured; $('#e-add').value = '';
  drawPhotos(); screen('edit');
}
$('#eBack').onclick = () => screen('shell');
$('#ePhotos').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(!b) return; ed.photos.splice(+b.dataset.i, 1); ed.changed = true; drawPhotos(); });
function compressImage(file, maxDim = 1200, q = 0.72){
  return new Promise(resolve => {
    let done = false; const finish = v => { if(!done){ done = true; resolve(v); } };
    const timer = setTimeout(() => finish(''), 10000);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { try{ const sc = Math.min(1, maxDim / Math.max(img.width, img.height)); const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); finish(c.toDataURL('image/jpeg', q).split(',')[1]); }catch(e){ finish(''); } clearTimeout(timer); URL.revokeObjectURL(url); };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); finish(''); }; img.src = url;
  });
}
$('#e-add').addEventListener('change', async () => {
  const files = Array.from($('#e-add').files || []).slice(0, 5); if(!files.length) return;
  toast('برفع الصور...');
  let ok = 0;
  for(const f of files){ const b = await compressImage(f); if(!b) continue;
    try{ const r = await call({ action: 'admin_photo', id: ed.id, data: b }); if(r.success && r.url){ ed.photos.push(r.url); ok++; } }catch(e){} }
  $('#e-add').value = ''; drawPhotos(); toast(ok === files.length ? 'اترفعت ✓' : 'اترفع ' + ok + ' من ' + files.length);
});

$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btnEl = $('#addSave'); btnEl.disabled = true; const label = btnEl.textContent; const v = id => $('#' + id).value.trim();
  try{
    const files = Array.from($('#a-photos').files || []).slice(0, 5), photos = [];
    if(files.length) btnEl.textContent = 'بجهّز الصور...';
    for(const f of files){ const b = await compressImage(f); if(b) photos.push(b); }
    btnEl.textContent = 'بحفظ...';
    const j = await call({ action: 'admin_add', type: v('a-type'), deal: v('a-deal'), loc: v('a-loc'), title: v('a-title') || (v('a-loc') + ' - ' + v('a-type')), price: v('a-price'), area: v('a-area'), rooms: v('a-rooms'), desc: v('a-desc'), owner: $('#a-owner').checked });
    if(!j.success) throw new Error('save');
    let up = 0;
    for(let i = 0; i < photos.length; i++){ btnEl.textContent = 'برفع الصور ' + (i + 1) + '/' + photos.length;
      for(let t = 0; t < 2; t++){ try{ const r = await call({ action: 'admin_photo', id: j.id, data: photos[i] }); if(r.success){ up++; break; } }catch(err){} } }
    $('#addForm').reset(); await load(); tab = 'live'; render(); go('list');
    toast(up < photos.length ? 'اتنشر، بس ' + (photos.length - up) + ' صورة ماترفعتش' : 'اتنشر على الموقع ✓');
  }catch(err){ toast('ماحصلش حفظ، جرّب تاني'); }
  btnEl.disabled = false; btnEl.textContent = label;
});

// ---------- activity ----------
const ago = t => { if(!t) return ''; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'دلوقتي' : m < 60 ? 'من ' + m + ' دقيقة' : m < 1440 ? 'من ' + Math.round(m / 60) + ' ساعة' : 'من ' + Math.round(m / 1440) + ' يوم'; };
async function loadLog(){
  const c = { new: 0, live: 0, done: 0 }; items.forEach(p => c[group(p)]++);
  $('#stats').innerHTML = '<button class="on">جديدة <b>' + c.new + '</b></button><button>ظاهرة <b>' + c.live + '</b></button><button>مقفولة <b>' + c.done + '</b></button>';
  let rows = []; try{ const j = await call({ action: 'admin_log' }); if(j.success) rows = j.items || []; }catch(e){}
  $('#logList').innerHTML = rows.length ? rows.map(r => '<div class="log"><b>' + esc(r.title || 'عقار') + '</b><small>' + esc(r.from) + ' ← ' + esc(r.to) + ' · ' + ago(r.t) + '</small></div>').join('') : '<div class="empty">لسه مفيش حركة مسجّلة</div>';
}
